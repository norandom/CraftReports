[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "craftreport-gridcraft"
version = "0.1.0"
description = "Bounded GridCraft workbook candidate mapping; browser support untested"
requires-python = ">=3.12,<3.13"
dependencies = ["craftreport==0.1.0", "xlsxwriter==3.2.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/craftreport_gridcraft"]

[tool.hatch.build.targets.sdist]
include = ["src/craftreport_gridcraft", "pyproject.toml"]
