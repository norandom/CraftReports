# Kernel engineering policy approved with its Design and implemented by foundation tasks 1.1-1.4.
# Mandatory direction: typed Python, Ruff lint/format, pre-commit and CI parity.
# Numeric approval covers listed kernel, browser, snapshot-runtime, report-model and GridCraft scopes.

[meta]
schema_version = 1
drafted = "2026-10-13"
status = "approved-scope-policy-enforced"
numeric_limits_approved = true
approval_reference = ".kiro/specs/craftreport-operation-kernel/design-review.md"
approved_capability_ids = ["contracts", "application", "adapters", "interfaces", "composition", "development-gates", "browser-verification", "data", "runtime", "snapshot-storage", "reporting", "themes", "policies", "public-packs", "gridcraft"]
tool_versions_pinned = true
enforcement_implemented = true
hooks_installed = true
fast_checks_passing = true
installed_hook_passing = true
ci_configured = true
ci_run_verified = true
integration_available = true
capability_source = "breadth.toml"

[tooling]
typed_python_required = true
primary_typechecker = "pyright-strict"
ruff_lint_required = true
ruff_format_required = true
pre_commit_required = true
ci_same_configuration_required = true
aggregate_checks_run_whole_scope = true
browser_e2e_is_separate_required_stage = true

[measurement.lloc]
definition = "radon.raw.analyze(...).lloc"
version = "6.0.1"
source_extensions = [".py", ".pyi"]
capability_aggregation = "sum-unique-owned-files"
ownership_resolution = "most-specific-declared-owner"
include_owned_production_code = true
tests_reported_separately = true
exclude_generated_and_vendor_code = true
function_extraction = "dedented-FunctionDef-or-AsyncFunctionDef-first-decorator-through-end_lineno; nested-definitions-included-and-individually-checked; files-count-once"

[measurement.branching]
definition = "mccabe-function-complexity"
tool = "ruff-C901"
version = "0.17.0"

[limits]
status = "approved-for-meta-approved-capability-ids"
max_function_lloc = 50
max_module_lloc = 300
max_capability_lloc = 1500
max_function_cyclomatic_complexity = 10
apply_before_associated_implementation_lands = true
calibrate_against_first_vertical_slice = true

[budgets]
capability_ids = ["contracts", "domain", "data", "compute", "reporting", "themes", "policies", "application", "runtime", "adapters", "transports", "interfaces", "composition", "gridcraft", "development-gates", "browser-verification", "snapshot-storage", "public-packs"]
scope_source = "breadth.toml capability owner paths"
limit_state = "approved-for-meta-approved_capability_ids-only"
more_specific_extension_owns_its_files = true
moving_files_does_not_reset_feature_budget = true
per_feature_override_requires_review = true

[waivers]
entries = []
required_fields = ["id", "capability_id", "exact_path_or_rule", "owner", "reason", "approval_reference", "expires_at"]
expired_waivers_fail = true
blanket_waivers_forbidden = true

[scope_approval.browser-verification]
approved = true
approved_at = "2026-10-14"
approval_reference = ".kiro/specs/craftreport-browser-verification/design-review.md"
capability_id = "browser-verification"
limits = "approved 50 function / 300 module / 3400 browser capability LLOC and McCabe 10"
budget_amendment_reference = ".kiro/specs/craftreport-browser-verification/lifecycle-evidence-budget-amendment.md"
budget_amendment_approved_at = "2026-10-15"
budget_gate_state = "implemented-task-4.0; exact-browser-3400-enforced; task-review-accepted"
previous_budget_amendment_reference = ".kiro/specs/craftreport-browser-verification/budget-amendment.md"
previous_budget_gate_state = "implemented-task-2.3; exact-browser-2800-enforced; task-review-accepted"
implementation_authorization_source = ".kiro/specs/craftreport-browser-verification/spec.json"

[scope_approval.snapshot-runtime]
approved = true
approved_at = "2026-10-15"
approval_reference = ".kiro/specs/craftreport-snapshot-runtime/design-review.md"
capability_ids = ["data", "runtime", "snapshot-storage"]
limits = "50 function / 300 module / 2000 snapshot-storage capability LLOC and McCabe 10; data/runtime retain 1500"
budget_amendment_reference = ".kiro/specs/craftreport-snapshot-runtime/storage-budget-calibration-amendment.md"
budget_amendment_approved_at = "2026-10-16"
budget_gate_state = "implemented-task-4.0; exact-storage-2000-enforced; task-review-accepted"
executable_owner = "development-gates"
executable_paths = ["scripts/examples/publish_and_recover_snapshot.py", "scripts/examples/snapshot_demo_host.py"]
content_owner = "public-packs"
content_paths = ["examples/data/snapshot_runtime.json"]
documentation_owner = "documentation"
documentation_paths = ["docs/quickstarts/Quickstart_How_to_publish_and_recover_a_snapshot.md", "docs/quickstarts/index.md"]
implementation_authorization_source = ".kiro/specs/craftreport-snapshot-runtime/spec.json"

[scope_approval.adapter-calibration]
approved = true
approved_at = "2026-10-16"
capability_id = "adapters"
budget_amendment_reference = ".kiro/specs/craftreport-report-model-packs/adapter-budget-calibration-amendment.md"
limits = "50 function / 300 module / 1800 adapters capability LLOC and McCabe 10"

[scope_approval.report-model-packs]
approved = true
approved_at = "2026-10-15"
approval_reference = ".kiro/specs/craftreport-report-model-packs/design-review.md"
capability_ids = ["reporting", "themes", "policies", "public-packs"]
limits = "existing defaults: 50 function / 300 module / 1500 capability LLOC and McCabe 10; no raises"
supporting_capability_ids = ["adapters", "composition", "development-gates", "documentation"]
source_paths = ["src/craftreport/reporting/definitions.py", "src/craftreport/reporting/prepared.py", "src/craftreport/reporting/prepare.py", "src/craftreport/reporting/ports.py", "src/craftreport/reporting/operations.py", "src/craftreport/reporting/registration.py", "src/craftreport/themes/values.py", "src/craftreport/themes/resolve.py", "src/craftreport/policies/values.py", "src/craftreport/policies/evaluate.py", "src/craftreport/adapters/report_models.py", "src/craftreport/adapters/report_codecs.py", "src/craftreport/adapters/pack_reader.py", "src/craftreport/adapters/report_resources.py", "src/craftreport/composition/reporting.py"]
executable_owner = "development-gates"
executable_paths = ["scripts/examples/prepare_reusable_report.py", "tests/reporting/report_demo.py"]
content_owner = "public-packs"
content_paths = ["examples/reports/supplied_portfolio.json", "examples/templates/public_report/manifest.json", "examples/themes/house.json"]
documentation_owner = "documentation"
documentation_paths = ["docs/quickstarts/Quickstart_How_to_prepare_a_reusable_report.md", "docs/quickstarts/index.md"]
implementation_authorization_source = ".kiro/specs/craftreport-report-model-packs/spec.json"

[scope_approval.gridcraft-web-reports]
approved = true
approved_at = "2026-10-15"
approval_reference = ".kiro/specs/craftreport-gridcraft-web-reports/design-review.md"
capability_id = "gridcraft"
limits = "existing defaults: 50 function / 300 module / 1500 capability LLOC and McCabe 10; no raises"
supporting_capability_ids = ["development-gates", "deployment", "documentation"]
source_paths = ["packages/craftreport-gridcraft/src/craftreport_gridcraft"]
resource_paths = ["packages/craftreport-gridcraft/resources/report.html", "packages/craftreport-gridcraft/resources/report.js"]
test_paths = ["tests/gridcraft"]
executable_owner = "development-gates"
executable_paths = ["scripts/examples/run_live_gridcraft_report.py", "scripts/examples/gridcraft_report_host.py"]
executable_planning_lloc = 120
shared_executable_limit = "all snapshot/report/app recipes share the unchanged development-gates 1500 capability limit"
deployment_owner = "deployment"
deployment_paths = ["deploy/gridcraft-report/compose.yaml", "deploy/gridcraft-report/nginx.conf"]
documentation_owner = "documentation"
documentation_paths = ["docs/quickstarts/Quickstart_How_to_run_a_live_GridCraft_report.md", "docs/quickstarts/index.md", "README.md"]
implementation_authorization_source = ".kiro/specs/craftreport-gridcraft-web-reports/spec.json"

[future_gate_families]
required = ["ruff-lint", "ruff-format", "strict-typecheck", "lloc-budgets", "branching-budgets", "breadth-ledger", "dependency-boundaries"]
commands = "uv run python scripts/check.py --fast"

[selected_tool_versions]
# Exact installed selections are pinned by pyproject.toml and uv.lock.
ruff = "0.17.0"
pyright = "1.1.414"
radon = "6.0.1"
pre_commit = "4.7.0"
uv = "0.13.0"

[capability_limits]
# Numeric enforcement, never a waiver; omitted entries retain the global default.
[[capability_limits.entries]]
capability_id = "browser-verification"
rule = "capability-lloc"
value = 3400
approved = true
owner = "project-owner"
rationale = "Owner approved browser-only lifecycle evidence calibration on 2026-10-15; global and local limits remain unchanged"
approval_reference = ".kiro/specs/craftreport-browser-verification/lifecycle-evidence-budget-amendment.md"

[[capability_limits.entries]]
capability_id = "snapshot-storage"
rule = "capability-lloc"
value = 2000
approved = true
owner = "project-owner"
rationale = "Owner approved storage-only calibration on 2026-10-16; all other global and local limits remain unchanged"
approval_reference = ".kiro/specs/craftreport-snapshot-runtime/storage-budget-calibration-amendment.md"

[[capability_limits.entries]]
capability_id = "adapters"
rule = "capability-lloc"
value = 1800
approved = true
owner = "project-owner"
rationale = "Owner approved adapters-only calibration on 2026-10-16; all other global and local limits remain unchanged"
approval_reference = ".kiro/specs/craftreport-report-model-packs/adapter-budget-calibration-amendment.md"
