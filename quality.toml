# Kernel engineering policy approved with its Design and implemented by foundation tasks 1.1-1.4.
# Mandatory direction: typed Python, Ruff lint/format, pre-commit and CI parity.
# Numeric approval covers the listed kernel capabilities; future capability budgets require activation review.

[meta]
schema_version = 1
drafted = "2026-10-13"
status = "kernel-policy-enforced"
numeric_limits_approved = true
approval_reference = ".kiro/specs/craftreport-operation-kernel/design-review.md"
approved_capability_ids = ["contracts", "application", "adapters", "interfaces", "composition", "development-gates"]
tool_versions_pinned = true
enforcement_implemented = true
hooks_installed = true
fast_checks_passing = true
installed_hook_passing = true
ci_configured = true
ci_run_verified = false
integration_available = true
capability_source = "breadth.toml"

[tooling]
typed_python_required = true
primary_typechecker = "pyright-strict"
ruff_lint_required = true
ruff_format_required = true
pre_commit_required = true
ci_same_configuration_required = true
aggregate_checks_run_whole_scope = true
browser_e2e_is_separate_required_stage = true

[measurement.lloc]
definition = "radon.raw.analyze(...).lloc"
version = "6.0.1"
source_extensions = [".py", ".pyi"]
capability_aggregation = "sum-unique-owned-files"
ownership_resolution = "most-specific-declared-owner"
include_owned_production_code = true
tests_reported_separately = true
exclude_generated_and_vendor_code = true
function_extraction = "dedented-FunctionDef-or-AsyncFunctionDef-first-decorator-through-end_lineno; nested-definitions-included-and-individually-checked; files-count-once"

[measurement.branching]
definition = "mccabe-function-complexity"
tool = "ruff-C901"
version = "0.17.0"

[limits]
status = "approved-for-kernel-scope"
max_function_lloc = 50
max_module_lloc = 300
max_capability_lloc = 1500
max_function_cyclomatic_complexity = 10
apply_before_associated_implementation_lands = true
calibrate_against_first_vertical_slice = true

[budgets]
capability_ids = ["contracts", "domain", "data", "compute", "reporting", "themes", "policies", "application", "runtime", "adapters", "transports", "interfaces", "composition", "gridcraft", "development-gates"]
scope_source = "breadth.toml capability owner paths"
limit_state = "approved-for-meta-approved_capability_ids-only"
more_specific_extension_owns_its_files = true
moving_files_does_not_reset_feature_budget = true
per_feature_override_requires_review = true

[waivers]
entries = []
required_fields = ["id", "capability_id", "exact_path_or_rule", "owner", "reason", "approval_reference", "expires_at"]
expired_waivers_fail = true
blanket_waivers_forbidden = true

[future_gate_families]
required = ["ruff-lint", "ruff-format", "strict-typecheck", "lloc-budgets", "branching-budgets", "breadth-ledger", "dependency-boundaries"]
commands = "uv run python scripts/check.py --fast"

[selected_tool_versions]
# Exact installed selections are pinned by pyproject.toml and uv.lock.
ruff = "0.17.0"
pyright = "1.1.414"
radon = "6.0.1"
pre_commit = "4.7.0"
uv = "0.13.0"
