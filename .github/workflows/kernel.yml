name: Kernel engineering

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  fast:
    name: Fast checks and retirement aging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
          python-version: '3.12.10'
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check.py --fast

  integration:
    name: Installed-wheel conformance (pending task 8.1)
    # A skipped stage is pending, never passing conformance. Enable when task 8.1 supplies it.
    if: ${{ false }}
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
          python-version: '3.12.10'
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check.py --integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-integration-evidence
          path: artifacts/
