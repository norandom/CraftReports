# Draft breadth ledger for CraftReport, 2026-10-13.
# Actual Kiro phases/approvals come from spec.json, not this ledger.
# active = declared work line; only phase-authorized work may land.
# done = acceptance work closed with evidence; retained code has an owner.
# parked = no implementation lands; unused scaffolding is removed if present.
# retiring = exact closes deletion/exit surfaces scheduled, with execution evidence.
# review = disposition required; removed = verified closure, retained as a release tombstone.
# open_fronts = active/review real specs + review/retiring capabilities with unexecuted required closure.
