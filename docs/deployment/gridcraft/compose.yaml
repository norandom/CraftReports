# Static web-app hosting recipe; not a Rust daemon or CraftReport API deployment.
# Download/extract the official web archive first, then set CRAFT_WEB_ROOT to
# the directory containing index.html, the JS loader and the compiled WASM app.
# See ../../gridcraft-setup.md. The existing probe uses its own project on 8871.
name: craftreport-gridcraft-docs
services:
  web:
    image: nginx@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports:
      - "${CRAFT_HTTP_BIND:-0.0.0.0}:${CRAFT_HTTP_PORT:-8872}:80"
    volumes:
      - "${CRAFT_WEB_ROOT:?Set CRAFT_WEB_ROOT to the extracted release directory}:/usr/share/nginx/html:ro"
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped
